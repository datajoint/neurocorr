name: neurocorr
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: datajoint
      POSTGRES_PASSWORD: datajoint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datajoint"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
