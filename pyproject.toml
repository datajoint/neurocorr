[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocorr"
version = "0.1.0"
description = "Improved estimation and interpretation of correlations in neural circuits (Yatsenko et al., 2015), as a DataJoint pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "DataJoint", email = "support@datajoint.com"},
]
maintainers = [
    {name = "DataJoint", email = "support@datajoint.com"},
]
keywords = [
    "datajoint",
    "neuroscience",
    "noise-correlations",
    "covariance-estimation",
    "calcium-imaging",
    "pipeline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # <npy@> in the default store needs a fix that is on master, after the 2.3.4 release
    "datajoint[postgres] @ git+https://github.com/datajoint/datajoint-python.git@master",
    "numpy",
    "scipy",
    "gglasso>=0.3.1",
]

[project.optional-dependencies]
# S3-compatible stores (datajoint's own s3 extra: s3fs)
s3 = ["datajoint[s3] @ git+https://github.com/datajoint/datajoint-python.git@master"]

[project.urls]
Homepage = "https://github.com/datajoint/neurocorr"
Documentation = "https://docs.datajoint.com"
Repository = "https://github.com/datajoint/neurocorr"
Issues = "https://github.com/datajoint/neurocorr/issues"
Paper = "https://doi.org/10.1371/journal.pcbi.1004083"
"Original code" = "https://github.com/atlab/cov-est"

# PEP 735: Dependency Groups (for development tools)
[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "testcontainers[postgres]>=4.0",
]
lint = [
    "ruff>=0.4",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neurocorr"]

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF012", # mutable class attributes (DataJoint uses `contents` for Lookup tables)
]

[tool.ruff.lint.isort]
known-first-party = ["neurocorr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: Fast tests without database access",
    "integration: Tests requiring database access",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.coverage.run]
source = ["src/neurocorr"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
